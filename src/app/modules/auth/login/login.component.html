<div class="login-tela">
  <div class="painel-marca">
    <a routerLink="/" class="logo">✚ Saúde+</a>

    <div class="ilustracao">
      <span class="icone-coracao">♥</span>
    </div>

    <p>Sua saúde em um só lugar</p>
  </div>

  <div class="painel-form">
    <form
      class="card-login"
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
    >
      <h1>Entrar na sua conta</h1>

      <p class="subtitulo">
        Acesse sua área de saúde.
      </p>

      <div class="campo">
        <label for="cpf">CPF</label>

        <input
          id="cpf"
          type="text"
          formControlName="cpf"
          placeholder="000.000.000-00"
        />
      </div>

      <div class="campo">
        <label for="senha">Senha</label>

        <input
          id="senha"
          type="password"
          formControlName="senha"
          placeholder="Digite sua senha"
        />
      </div>

      @if (errorMessage) {
        <p class="erro-campo">
          {{ errorMessage }}
        </p>
      }

      <div class="linha-opcoes">
        <label class="lembrar">
          <input type="checkbox" />
          Lembrar de mim
        </label>

        <a class="esqueci">
          Esqueci minha senha
        </a>
      </div>

      <app-button
        variante="primario"
        type="submit"
        [disabled]="IsLoading"
      >
        {{ IsLoading ? 'Entrando...' : 'Entrar' }}
      </app-button>

      <div class="divisor">
        <span>ou</span>
      </div>

      <app-button
        variante="secundario"
        type="button"
        class="btn-google"
      >
        Continuar com Google
      </app-button>

      @if (perfil === 'paciente') {
        <p class="rodape-login">
          Ainda não tem uma conta?

          <a
            class="cadastrar"
            routerLink="/cadastro"
          >
            Criar conta
          </a>
        </p>
      }

      <app-button
        variante="voltar"
        type="button"
        class="voltar"
        (clicked)="voltar()"
      >
        ← Voltar
      </app-button>
    </form>
  </div>
</div>
