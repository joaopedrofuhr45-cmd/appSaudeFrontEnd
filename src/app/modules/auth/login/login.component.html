<div class="login-tela">
  <div class="painel-marca">
    <a routerLink="/" class="logo">✚ Saúde+</a>
    <div class="ilustracao">
      <span class="icone-coracao">♥</span>
    </div>
    <p>Sua saúde em um só lugar</p>
  </div>

  <div class="painel-form">
    <form class="card-login" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <h1>Entrar na sua conta</h1>
      <p class="subtitulo">Acesse sua área de saúde.</p>

      <div class="campo">
        <label>CPF</label>
        <input type="text" formControlName="cpf" placeholder="000.000.000-00" />
      </div>

      <div class="campo">
        <label>Senha</label>
        <input type="password" formControlName="senha" placeholder="Digite sua senha" />
      </div>

      @if (errorMessage) {
        <p class="erro-campo">{{ errorMessage }}</p>
      }

      <div class="linha-opcoes">
        <label class="lembrar"><input type="checkbox" /> Lembrar de mim</label>
        <a class="esqueci">Esqueci minha senha</a>
      </div>

      <app-button variante="primario" type="submit" [disabled]="IsLoading">
        {{ IsLoading ? 'Entrando...' : 'Entrar' }}
      </app-button>

      <div class="divisor"><span>ou</span></div>

      <button type="button" class="btn-google">Continuar com Google</button>

      @if (perfil === 'paciente') {
        <p class="rodape-login">Ainda não tem uma conta? <a class="cadastrar" routerLink="/cadastro">Criar conta</a></p>
      }

      <a class="voltar" routerLink="/menu-inicial">Voltar</a>
    </form>
  </div>
</div>
