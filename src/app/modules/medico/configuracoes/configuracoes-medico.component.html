<div class="layout"><app-sidebar [nome]="nome" [subtitulo]="especialidade" [itens]="[{label:'Consultas do dia',rota:'/medico/dashboard'},{label:'Configurações',rota:'/medico/configuracoes'}]" rotaLogout="/menu-inicial"/><main class="conteudo"><app-page-header/><h1>Configurações</h1><p>Gerencie suas informações de acesso e segurança da conta.</p>@if(carregando){<p>Carregando seus dados…</p>}<form class="card" (ngSubmit)="salvar()"><div class="grid"><label>Nome completo<input name="nome" [(ngModel)]="nome"/></label><label>E-mail<input name="email" [(ngModel)]="email"/></label><label>Telefone<input name="telefone" [(ngModel)]="telefone"/></label></div><button class="primario" type="submit" [disabled]="salvando">{{salvando?'Salvando…':'Salvar alterações'}}</button></form><section class="seguranca"><h2>Segurança</h2><p>Atualize sua senha periodicamente para manter sua conta protegida.</p><div class="card"><h3>Mudar senha</h3><input name="senhaAtual" type="password" [(ngModel)]="senhaAtual" placeholder="Senha atual"/><div class="grid dois"><input name="novaSenha" type="password" [(ngModel)]="novaSenha" placeholder="Nova senha"/><input name="confirmarSenha" type="password" [(ngModel)]="confirmarSenha" placeholder="Confirmar nova senha"/></div><button class="primario" type="button" [disabled]="salvandoSenha" (click)="salvarSenha()">{{salvandoSenha?'Salvando…':'Salvar nova senha'}}</button></div></section>@if(mensagem){<p class="mensagem">{{mensagem}}</p>}@if(erro){<p class="mensagem">{{erro}}</p>}</main></div>
