<div class="layout">
  <app-sidebar
    nome="Camila Reis"
    subtitulo="Atendente · Recepção"
    [itens]="[
      { label: 'Atendimentos', rota: '/atendente/home' },
      { label: 'Configurações', rota: '/atendente/configuracoes' }
    ]"
    rotaLogout="/menu-inicial"
  />

  <main class="conteudo">
    <app-page-header />
    <section>
      <h1>Configurações</h1>
      <p>Gerencie suas informações de acesso e segurança da conta.</p>
    </section>

    <form class="card" (ngSubmit)="salvarDados()">
      <div class="grid">
        <label>Nome completo<input name="nome" [(ngModel)]="nome" /></label>
        <label>E-mail<input name="email" [(ngModel)]="email" /></label>
        <label>Telefone<input name="telefone" [(ngModel)]="telefone" /></label>
      </div>
      <button class="primario" type="submit">Salvar alterações</button>
    </form>

    <section class="seguranca">
      <h2>Segurança</h2>
      <p>Atualize sua senha periodicamente para manter sua conta protegida.</p>
      <div class="card">
        <h3>Mudar senha</h3>
        <input name="senhaAtual" type="password" [(ngModel)]="senhaAtual" placeholder="Senha atual" />
        <div class="grid">
          <input name="novaSenha" type="password" [(ngModel)]="novaSenha" placeholder="Nova senha" />
          <input name="confirmarSenha" type="password" [(ngModel)]="confirmarSenha" placeholder="Confirmar nova senha" />
        </div>
        <button type="button" class="primario" (click)="salvarSenha()">Salvar nova senha</button>
      </div>
    </section>

    @if (mensagem) {
      <p class="mensagem">{{ mensagem }}</p>
    }
  </main>
</div>
