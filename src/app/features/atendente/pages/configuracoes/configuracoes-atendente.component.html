<div class="layout"><app-sidebar [nome]="nome" [fotoUrl]="fotoUrl" subtitulo="Atendente · Recepção" [itens]="[{label:'Atendimentos',rota:'/atendente/home'},{label:'Configurações',rota:'/atendente/configuracoes'}]" rotaLogout="/menu-inicial"/><main class="conteudo"><app-page-header/><section><h1>Configurações</h1><p>Gerencie suas informações de acesso e segurança da conta.</p></section>@if(carregando){<p>Carregando seus dados…</p>}<div class="card"><app-avatar-upload recurso="atendentes" [nome]="nome" [fotoUrl]="fotoUrl"/></div><form class="card" (ngSubmit)="salvarDados()"><div class="grid"><label>Nome completo<input name="nome" [(ngModel)]="nome"/></label><label>E-mail<input name="email" [(ngModel)]="email"/></label><label>Telefone<input name="telefone" [(ngModel)]="telefone"/></label></div><button class="primario" type="submit" [disabled]="salvando">{{salvando?'Salvando…':'Salvar alterações'}}</button></form><section class="seguranca"><h2>Segurança</h2><p>Atualize sua senha periodicamente para manter sua conta protegida.</p><app-alterar-senha [salvando]="salvandoSenha" [erro]="erroSenha" (salvar)="salvarSenha($event)"/></section>@if(mensagem){<p class="mensagem">{{mensagem}}</p>}@if(erro){<p class="mensagem">{{erro}}</p>}</main></div>
