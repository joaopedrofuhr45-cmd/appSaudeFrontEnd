<div class="layout">
  <app-sidebar
    [nome]="nome"
    [subtitulo]="subtitulo"
    [itens]="[
      { label: 'Atendimentos', rota: '/atendente/home' },
      { label: 'Configurações', rota: '/atendente/configuracoes' },
    ]"
    rotaLogout="/menu-inicial"
  />

  <main class="conteudo">
    <app-page-header
      acaoLabel="Novo agendamento"
      acaoRota="/atendente/novo-agendamento"
    />

    <h1>Atendimentos</h1>
    <p class="subtitulo">Todas as consultas do hospital na data selecionada.</p>

    <section class="filtros" appReveal>
      <div class="campo campo-dia">
        <label>Data</label>
        <app-seletor-dia [valor]="dataSelecionada" (escolher)="selecionarData($event)" />
      </div>
      <div class="campo campo-grande">
        <label for="filtro-busca">Buscar paciente</label>
        <input id="filtro-busca" class="input" type="text" placeholder="Nome do paciente"
               [(ngModel)]="busca" />
      </div>
      <div class="campo">
        <label for="filtro-situacao">Situação</label>
        <select id="filtro-situacao" class="input" [(ngModel)]="situacao">
          <option value="">Todas</option>
          <option value="AGENDADO">Agendada</option>
          <option value="CONFIRMADO">Confirmada</option>
          <option value="EM_ESPERA">Em espera</option>
          <option value="CONCLUIDO">Concluída</option>
          <option value="CANCELADO">Cancelada</option>
        </select>
      </div>
    </section>

    <div class="stats">
      <app-stat-card appReveal [appRevealDelay]="0"   icone="📅" [valor]="'' + consultas.length" label="consultas no dia" />
      <app-stat-card appReveal [appRevealDelay]="80"  icone="✓" [valor]="'' + totalAgendadas" label="agendadas" />
      <app-stat-card appReveal [appRevealDelay]="160" icone="⏱" [valor]="proximoHorario" label="próximo horário" />
    </div>

    <div class="lista">
      <div class="lista-cabecalho">
        <span>Agenda de {{ dataFormatada }}</span>
        <a class="exportar">Exportar lista</a>
      </div>

      @if (carregando) {
        <p class="vazio">Carregando...</p>
      } @else if (erro) {
        <p class="erro" role="alert">{{ erro }}</p>
      } @else {
        @for (c of consultasFiltradas; track c.id; let i = $index) {
          <app-consulta-row
            appReveal [appRevealDelay]="i * 60"
            [horario]="c.horario"
            [nome]="c.nomePaciente"
            [detalhe]="c.detalhe"
            [status]="statusParaBadge(c.status)"
            [statusTexto]="statusTexto(c.status)"
          />
        } @empty {
          <p class="vazio">Nenhum atendimento encontrado.</p>
        }
      }
    </div>
  </main>
</div>
