<app-page-header />
<section class="titulo"><h1>Configurações</h1><p>Gerencie seu perfil, suas informações de acesso e a segurança da conta.</p></section>
@if (carregando) { <p>Carregando seus dados…</p> }
<app-avatar-upload recurso="pacientes" [nome]="nome" [fotoUrl]="fotoUrl" />
<form class="dados" [formGroup]="dados" (ngSubmit)="salvarDados()">
  <label>Nome completo<input formControlName="nome" /></label>
  <label>E-mail<input type="email" formControlName="email" /></label>
  <label>Telefone<input type="tel" formControlName="telefone" /></label>
  @if (mensagemDados) { <p class="mensagem">{{ mensagemDados }}</p> }
  <button type="submit" [disabled]="salvandoDados">{{ salvandoDados ? 'Salvando…' : '▣ Salvar alterações' }}</button>
</form>
<section class="seguranca">
  <h2>Segurança</h2><p>Atualize sua senha periodicamente para manter sua conta protegida.</p>
  <app-alterar-senha [salvando]="salvandoSenha" [mensagem]="mensagemSenha" [erro]="erroSenha" (salvar)="salvarSenha($event)" />
</section>
