<header class="header" [class.rolado]="rolado">
  <a routerLink="/" fragment="inicio" class="logo">✚ Saúde+</a>

  <nav class="nav" aria-label="Seções da página">
    @for (item of itens; track item.id) {
      <a
        routerLink="/"
        [fragment]="item.id"
        class="nav-link"
        [class.ativo]="ativa === item.id"
        [attr.aria-current]="ativa === item.id ? 'location' : null"
      >{{ item.rotulo }}</a>
    }
  </nav>

  <div class="acoes">
    <a routerLink="/menu-inicial" class="btn-header btn-header-outline">Entrar</a>
  </div>
</header>
